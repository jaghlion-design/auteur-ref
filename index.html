xpérience et son autonomie au cœur de l'accompagnement."}, {"term": "Congruence / authenticité", "definition": "accord juste entre ce que le thérapeute ressent intérieurement, ce qu'il vit et ce qu'il exprime dans la relation."}, {"term": "Considération positive inconditionnelle", "definition": "accueil chaleureux et non jugeant de la personne, indépendamment de ses comportements ou de ses réussites."}, {"term": "Écoute empathique", "definition": "capacité à comprendre le cadre de référence interne de l'autre avec sensibilité, comme si l'on était l'autre sans perdre sa propre identité."}, {"term": "Tendance à l'actualisation", "definition": "impulsion naturelle de l'organisme à se développer, se différencier et réaliser son potentiel."}], "refs": ["Rogers, C. R. (1951). Client-Centered Therapy. Houghton Mifflin.", "Rogers, C. R. (1961). Le développement de la personne. Dunod."]}, "carol-byron-norton": {"name": "Carol & Byron Norton", "profession": "Psychothérapeutes / psychologues spécialisés en thérapie par le jeu (Play Therapy)", "sortName": "Norton", "terms": [{"term": "Experiential Play Therapy (EPT)", "definition": "approche de thérapie par le jeu centrée sur l'expérience émotionnelle directe et la relation thérapeutique plutôt que sur la seule interprétation verbale."}, {"term": "Jeu métaphorique", "definition": "utilisation symbolique des jouets, scénarios et mises en scène pour exprimer et transformer des conflits ou traumatismes."}, {"term": "Régulation du système nerveux dans le jeu", "definition": "apaisement et rééquilibrage des réactions d'alerte ou de sidération grâce à des expériences ludiques sécurisantes."}, {"term": "Réparation du lien d'attachement", "definition": "restauration d'un lien de confiance et de sécurité émotionnelle à travers la relation thérapeutique."}], "refs": ["Norton, C. C., & Norton, B. E. (1997). Reaching Children Through Play Therapy: An Experiential Approach. White Apple Press."]}, "catherine-potel": {"name": "Catherine Potel", "profession": "Psychomotricienne, psychothérapeute et docteure en psychopathologie", "sortName": "Potel", "terms": [{"term": "Corps souffrant / corps contenant", "definition": "double dimension du corps pouvant être le lieu d'une douleur/d'un symptôme tout en servant d'enveloppe et de soutien psychique."}, {"term": "Enveloppes psychocorporelles", "definition": "frontières et contenants corporels et psychiques qui délimitent le sujet et régulent les échanges avec l'extérieur."}, {"term": "Symbolisation par le corps", "definition": "élaboration et mise en forme des éprouvés archaïques ou traumatiques à travers le mouvement, le tonus et la médiation corporelle."}, {"term": "Clinique du lien", "definition": "approche thérapeutique attentive à la qualité, aux ruptures et à la restauration des liens relationnels et corporels."}], "refs": ["Potel, C. (2010). Être psychomotricien : un métier du présent, un métier d'avenir. Érès.", "Potel, C. (2015). Le corps et l'eau : une médiation en psychomotricité. Érès."]}, "christian-ballouard": {"name": "Christian Ballouard", "profession": "Psychomotricien et auteur", "sortName": "Ballouard", "terms": [{"term": "Cadre thérapeutique contenant", "definition": "ensemble des repères stables (temps, espace, règles, attitude du psychomotricien) qui sécurise et rend possible le travail psychique."}, {"term": "Médiations corporelles", "definition": "supports et activités corporels utilisés comme tiers facilitant l'expression, la relation et la symbolisation."}, {"term": "Transfert primaire et secondaire", "definition": "réactualisation dans la relation thérapeutique de modes relationnels précoces/archaïques (primaire) ou de liens/conflits plus élaborés (secondaire)."}, {"term": "Troubles psychomoteurs (inhibition, instabilité, dyspraxie)", "definition": "manifestations cliniques touchant l'organisation tonico-posturale, l'action et la régulation motrice (repli/retenue, agitation/dispersion, difficultés de coordination/planification gestuelle)."}], "refs": ["Ballouard, C. (2003). Le travail du psychomotricien. Dunod.", "Ballouard, C. (2008). L'aide-mémoire de psychomotricité. Dunod."]}, "daniel-courberand": {"name": "Daniel Courberand", "profession": "Psychomotricien et psychothérapeute", "sortName": "Courberand", "terms": [{"term": "Corps comme lieu de l'aventure psychique", "definition": "conception du corps comme espace privilégié où s'éprouvent, se jouent et se transforment les mouvements psychiques."}, {"term": "Enveloppes corporelles", "definition": "limites sensori-motrices et psychiques permettant d'éprouver une unité et de contenir les angoisses."}, {"term": "Groupes thérapeutiques en psychomotricité", "definition": "dispositifs collectifs favorisant la socialisation, l'étayage par les pairs et l'expérimentation corporelle partagée."}, {"term": "Clinique de l'enfant sans langage", "definition": "approche adaptée aux enfants qui ne communiquent pas ou peu par la parole, s'appuyant sur le corps, le tonus et les médiations non verbales."}], "refs": ["Courberand, D. (2013). La psychomotricité, une aventure psychique. In Press.", "Courberand, D. (2018). Clinique psychomotrice de l'enfant."]}, "daniel-stern": {"name": "Daniel Stern", "profession": "Psychiatre et psychanalyste", "sortName": "Stern", "terms": [{"term": "Sens de soi (sense of self", "definition": "émergent, nucléaire, subjectif, verbal, narratif) : sentiment continu et évolutif d'exister et d'être un agent distinct, se complexifiant par strates au cours du développement."}, {"term": "Accordage affectif (affect attunement)", "definition": "comportement par lequel l'adulte reflète et partage la qualité émotionnelle/l'intensité d'un éprouvé du bébé sans simple imitation littérale."}, {"term": "Enveloppe protonarrative", "definition": "organisation temporelle et dynamique d'une expérience vécue (avec début, tension/point culminant, résolution) formant une matrice pré-verbale de récit."}, {"term": "RIGs (représentations d'interactions généralisées)", "definition": "schémas internes construits à partir de la répétition d'interactions vécues avec l'entourage, guidant les attentes relationnelles."}], "refs": ["Courberand, D. (2013). La psychomotricité, une aventure psychique. In Press.", "Courberand, D. (2018). Clinique psychomotrice de l'enfant."], "note": "Références identiques à celles de Daniel Courberand dans le fichier d'origine : à vérifier."}, "didier-anzieu": {"name": "Didier Anzieu", "profession": "Psychanalyste et professeur de psychologie clinique", "sortName": "Anzieu", "terms": [{"term": "Moi-peau", "definition": "figuration psychique par laquelle le moi de l'enfant se représente lui-même comme un moi qui contient les contenus psychiques, à partir de l'expérience de la peau."}, {"term": "Enveloppe psychique", "definition": "structure pare-excitations et contenante qui délimite l'espace psychique interne et permet les échanges avec l'environnement."}, {"term": "Fonctions du Moi-peau", "definition": "ensemble des neuf fonctions analogues à celles de la peau (maintien/contenance, pare-excitation, individuation, intersensorialité, étayage sur la pulsion sexuelle, sexualisation/recharge libidinale, inscription des traces, plus l'aspect toxique si défaillant)."}], "refs": ["Anzieu, D. (1985). Le Moi-peau. Dunod.", "Anzieu, D. et al. (1987). Les enveloppes psychiques. Dunod."]}, "donald-w-winnicott": {"name": "Donald W. Winnicott", "profession": "Pédiatre et psychanalyste", "sortName": "Winnicott", "terms": [{"term": "Objet transitionnel", "definition": "objet matériel (comme un doudou) choisi par le bébé qui aide à passer de la relation fusionnelle/primaire à l'environnement extérieur et apaise l'angoisse de séparation."}, {"term": "Espace / aire transitionnelle", "definition": "zone intermédiaire d'expérience (lieu du jeu, de la créativité et de la culture) située entre la réalité interne subjective et la réalité extérieure partagée."}, {"term": "Holding", "definition": "manière dont l'environnement (et le thérapeute) porte, soutient physiquement et psychiquement le bébé et assure une continuité d'existence."}, {"term": "Handling", "definition": "manière dont le bébé est manipulé et soigné physiquement, favorisant l'intégration psychosomatique et le sentiment d'habiter son corps."}, {"term": "Object presenting", "definition": "présentation graduelle et adaptée de la réalité extérieure au bébé afin qu'il puisse la rencontrer sans être submergé."}, {"term": "Mère suffisamment bonne (good enough mother)", "definition": "mère qui répond d'abord très finement aux besoins du bébé puis se désadapte progressivement au rythme de sa maturation."}, {"term": "True self / false self", "definition": "organisation authentique et spontanée de la personnalité (true self) par opposition à une façade défensive et soumise aux attentes extérieures (false self)."}, {"term": "Squiggle", "definition": "jeu de gribouillage alterné entre le thérapeute et l'enfant permettant de faire émerger des pensées, émotions et fantasmes."}], "refs": ["Winnicott, D. W. (1958). De la pédiatrie à la psychanalyse. Payot.", "Winnicott, D. W. (1971). Jeu et réalité : l'espace potentiel. Gallimard."]}, "emile-dupre": {"name": "Emile Dupré", "profession": "Neurologue et psychiatre", "sortName": "Dupré", "terms": [{"term": "Débilité motrice", "definition": "ensemble de particularités motrices (maladresse, syncinésies, paratonie, hypertonie) observées chez certains sujets et associées à des fragilités neuropsychiques."}, {"term": "Paratonie", "definition": "difficulté à relâcher volontairement ses muscles, entraînant une résistance ou une raideur lors de la mobilisation passive."}, {"term": "Syncinésies", "definition": "mouvements involontaires et parasites qui apparaissent dans une partie du corps lors de l'exécution d'un mouvement volontaire dans une autre partie."}, {"term": "Psychomotricité (co-élaboration du concept)", "definition": "notion introduite pour souligner les liens étroits entre le fonctionnement moteur, le tonus et la vie psychique."}], "refs": ["Dupré, E. (1907). La débilité motrice dans ses rapports avec la débilité mentale et l'insuffisance pyramidale.", "Dupré, E. (1925). Pathologie de l'imagination et de l'émotivité. Payot."]}, "emmi-pikler": {"name": "Emmi Pikler", "profession": "Pédiatre", "sortName": "Pikler", "terms": [{"term": "Motricité libre", "definition": "développement moteur spontané où l'enfant découvre et maîtrise seul les postures et déplacements, sans être mis ni maintenu artificiellement dans des positions qu'il n'a pas acquises par lui-même."}, {"term": "Activité autonome", "definition": "initiative propre de l'enfant qui choisit et explore ses jeux et mouvements à son rythme dans un environnement adapté."}, {"term": "Soin relationnel / soins attentifs", "definition": "moments de soins (change, repas, habillage) vécus comme des temps de rencontre, d'échange et de coopération plutôt que de simple exécution technique."}, {"term": "Sécurité affective", "definition": "sentiment de stabilité et de confiance issu d'une relation prévisible, respectueuse et disponible avec l'adulte."}, {"term": "Posture / gestuelle respectueuse", "definition": "attitude calme, lente et attentive de l'adulte qui laisse l'enfant participer activement et préserve sa dignité."}], "refs": ["Pikler, E. (1969/1979). Se mouvoir en liberté dès le premier âge. PUF.", "David, M., & Appell, G. (1973). Lóczy ou le maternage insolite. Érès."]}, "francoise-desobeau": {"name": "Françoise Désobeau", "profession": "Orthophoniste, psychomotricienne et thérapeute psychocorporelle", "sortName": "Désobeau", "terms": [{"term": "Thérapie psychomotrice à médiation corporelle", "definition": "prise en charge utilisant le mouvement, le jeu et le corps comme vecteurs d'expression et de transformation psychique."}, {"term": "Corps et langage", "definition": "articulation et échanges dynamiques entre les manifestations corporelles/non verbales et la mise en mots ou la symbolisation."}, {"term": "Communication non verbale et gestuelle", "definition": "transmission de messages, d'émotions et d'intentions par la posture, le regard, la mimique et le geste."}], "refs": ["Desobeau, F. (2009). La thérapie psychomotrice : du corps vécu au corps parlé.", "Contributions cliniques dans la revue Thérapie Psychomotrice et Recherches."]}, "francoise-dolto": {"name": "Françoise Dolto", "profession": "Psychanalyste et pédiatre", "sortName": "Dolto", "terms": [{"term": "Image inconsciente du corps (IIC) vs schéma corporel", "definition": "l'IIC est la synthèse vivante et inconsciente de nos expériences émotionnelles et relationnelles (propre à chacun, liée au désir), tandis que le schéma corporel est la représentation neurologique/anatomique et perceptive commune à l'espèce."}, {"term": "Castration symboligène", "definition": "épreuve structurante et humanisante (orale, anale, génitale, etc.) qui invite l'enfant à renoncer à une satisfaction immédiate ou fusionnelle pour accéder à plus d'autonomie et de symbolisation."}, {"term": "Complexe du homard", "definition": "image illustrant le moment où l'enfant quitte une enveloppe/protection devenue trop étroite et se retrouve temporairement vulnérable avant de former une nouvelle organisation."}, {"term": "« Tout est langage »", "definition": "idée que tout comportement, symptôme, geste ou silence d'un sujet a une valeur expressive et relationnelle porteur de sens."}], "refs": ["Dolto, F. (1984). L'image inconsciente du corps. Seuil.", "Dolto, F. (1981). Au jeu du désir. Seuil."]}, "francoise-giromini": {"name": "Françoise Giromini", "profession": "Psychomotricienne, cadre de santé / enseignante et auteure en psychomotricité", "sortName": "Giromini", "terms": [{"term": "Approche globale psychomotrice", "definition": "lecture et accompagnement de la personne envisageant ensemble le corps, l'émotion, la cognition et la relation."}, {"term": "Clinique et théorisation de la psychomotricité", "definition": "élaboration des repères théoriques et méthodologiques guidant l'observation, l'évaluation et l'intervention psychomotrices."}, {"term": "Corps et psyché", "definition": "interaction constante et réciproque entre les processus corporels et les mouvements psychiques."}], "refs": ["Giromini, F., Albaret, J.-M., & Scialom, P. (2011/2015). Manuel d'enseignement de psychomotricité (Tomes 1 à 3). De Boeck Supérieur."]}, "genevieve-haag": {"name": "Geneviève Haag", "profession": "Pédopsychiatre et psychanalyste", "sortName": "Haag", "terms": [{"term": "Identification adhésive", "definition": "mécanisme très précoce consistant à se coller ou s'adosser à une surface, une forme ou un objet pour maintenir un sentiment d'existence et éviter l'effondrement."}, {"term": "Enveloppe / carapace corporelle", "definition": "organisation défensive ou contenante du corps construite pour se protéger des angoisses d'anéantissement ou de morcellement."}, {"term": "Filiation / structuration de l'image du corps", "definition": "construction progressive du sentiment d'unité, d'axe et d'appartenance familiale et symbolique."}, {"term": "Retour sur soi", "definition": "mouvement d'intériorisation et de rassemblement des perceptions qui permet au sujet de se sentir unifié et présent à lui-même."}, {"term": "Équilibre / axe corporel", "definition": "verticalité et centralité corporelles associées au sentiment d'identité et de sécurité interne."}], "refs": ["Haag, G. (1985). « La mère et le bébé dans les deux moitiés du corps ». Neuropsychiatrie de l'Enfance et de l'Adolescence.", "Haag, G. (2018). Le Moi corporel : autour de la clinique de l'autisme. PUF."]}, "gert-holstege": {"name": "Gert Holstege", "profession": "Neuroanatomiste et neuroscientifique", "sortName": "Holstege", "terms": [{"term": "Système moteur émotionnel (Emotional Motor System - EMS) vs système moteur somatique", "definition": "l'EMS régule les postures, comportements et réponses physiologiques liées aux émotions et à la survie (défense, reproduction, vocalisation), distinct du système somatique orienté vers les mouvements volontaires et précis."}, {"term": "Substance grise périaqueducale (PAG)", "definition": "structure clé du tronc cérébral intégrant les signaux émotionnels et coordonnant des réponses motrices et autonomes adaptatives."}, {"term": "Noyau rétroambigu (nucleus retroambiguus)", "definition": "structure bulbaire recevant des projections de la PAG et relayant des commandes vers les motoneurones impliqués dans la respiration, la vocalisation et la posture."}], "refs": ["Holstege, G. (1992). « The emotional motor system ». European Journal of Morphology.", "Holstege, G., Bandler, R., & Saper, C. B. (1996). The Emotional Motor System. Elsevier."]}, "giselle-soubiran": {"name": "Giselle Soubiran", "profession": "Médecin, neuropsychiatre et rééducatrice en psychomotricité", "sortName": "Soubiran", "terms": [{"term": "Éducation psychomotrice", "definition": "démarche éducative et préventive visant à harmoniser le développement moteur, perceptif, cognitif et affectif de l'enfant."}, {"term": "Relaxation psychomotrice", "definition": "technique de détente corporelle et de régulation tonique favorisant la conscience du corps et l'apaisement psychique."}, {"term": "Schéma corporel", "definition": "conscience et connaissance de son corps, de ses segments, de sa posture et de ses limites dans l'espace."}, {"term": "Structuration spatio-temporelle", "definition": "organisation progressive des repères d'espace (orientation, latéralité, distances) et de temps (rythme, succession, durée)."}], "refs": ["Soubiran, G. B., & Mazo, P. (1965). La réadaptation scolaire des enfants intelligents par la rééducation psychomotrice. Doin.", "Soubiran, G. B., & Coste, J.-C. (1975). Psychomotricité et relaxation psychosomatique. Doin."]}, "henri-wallon": {"name": "Henri Wallon", "profession": "Psychologue, philosophe et homme politique", "sortName": "Wallon", "terms": [{"term": "Dialogue tonique", "definition": "échange premier, non verbal et émotionnel entre l'enfant et son entourage à travers les variations de tonus musculaire et d'attitude."}, {"term": "Émotion comme fonction sociale et motrice", "definition": "rôle fondamental de l'émotion qui relie l'organisme au milieu humain et s'exprime d'abord par des réactions toniques et posturales."}, {"term": "Stades du développement psychomoteur", "definition": "succession d'étapes marquées par des crises et des réorganisations entre le biologique, l'affectif, le moteur et le cognitif."}, {"term": "Alternance fonctionnelle / prévalence motrice puis affective", "definition": "succession dynamique dans le développement où prédominent tour à tour l'orientation vers l'action/le monde extérieur et l'orientation vers l'affectivité/l'intériorité."}], "refs": ["Wallon, H. (1925). L'enfant turbulent. Alcan.", "Wallon, H. (1934). Les origines du caractère chez l'enfant. Boivin / PUF.", "Wallon, H. (1941). L'évolution psychologique de l'enfant. Armand Colin."]}, "ivan-darrault": {"name": "Ivan Darrault", "profession": "Sémioticien et chercheur en sémiotique", "sortName": "Darrault", "terms": [{"term": "Psychosémiotique", "definition": "approche croisant la psychomotricité et la sémiotique pour analyser la production de sens dans les conduites corporelles et relationnelles."}, {"term": "Approche sémiotique de la thérapie psychomotrice", "definition": "lecture des gestes, postures, rythmes et interactions comme des systèmes de signes porteurs de significations."}, {"term": "Corps signifiant", "definition": "corps envisagé comme un espace d'expression et de signification où s'inscrivent des récits et des intentions."}, {"term": "Narrativité corporelle", "definition": "organisation dynamique et temporelle des actions et mouvements du sujet formant une trame expressive."}], "refs": ["Aucouturier, B., Darrault, I., & Empinet, J.-L. (1984). La pratique psychomotrice. Doin.", "Darrault-Harris, I., & Klein, J.-P. (1993). Pour une psychiatrie de l'ellipse : les aventures du sujet en création. PUF."]}, "jacques-ellul": {"name": "Jacques Ellul", "profession": "Sociologue, théologien et philosophe", "sortName": "Ellul", "terms": [{"term": "Technique / système technicien", "definition": "ensemble des moyens rationnellement et efficacement organisés dans chaque domaine d'activité, formant un système global interconnecté."}, {"term": "Autonomie de la technique", "definition": "tendance de la technique à évoluer selon sa propre logique et ses propres normes, échappant partiellement au contrôle moral ou politique."}, {"term": "Société de consommation / propagande", "definition": "organisation sociale marquée par la consommation de masse et l'usage systématique de la propagande pour orienter les opinions et comportements."}], "refs": ["Ellul, J. (1954). La Technique ou l'Enjeu du siècle. Armand Colin.", "Ellul, J. (1962). Propagandes. Armand Colin.", "Ellul, J. (1977). Le Système technicien. Calmann-Lévy."]}, "jacques-paillard": {"name": "Jacques Paillard", "profession": "Neurobiologiste et neurophysiologiste de la motricité", "sortName": "Paillard", "terms": [{"term": "Commande motrice", "definition": "processus neurophysiologique par lequel le système nerveux central élabore, déclenche et ajuste l'exécution d'un mouvement."}, {"term": "Perception et action", "definition": "boucle interactive permanente où l'action transforme les perceptions et où la perception guide et corrige l'action."}, {"term": "Régulation sensorimotrice", "definition": "ajustement continu du mouvement à partir des informations sensorielles entrantes et des prédictions motrices."}, {"term": "Proprioception et extéroception", "definition": "recueil des informations issues de l'intérieur du corps (muscles, articulations, position) et de l'environnement externe (vue, toucher, audition)."}], "refs": ["Paillard, J. (1976). « Tonus, posture et mouvement ». In Kayser, C. (dir.), Physiologie (Tome II). Flammarion.", "Paillard, J. (1991). Brain and Space. Oxford University Press."]}, "janusz-korczak": {"name": "Janusz Korczak", "profession": "Médecin, pédagogue et écrivain", "sortName": "Korczak", "terms": [{"term": "Respect de l'enfant comme personne à part entière", "definition": "reconnaissance de l'enfant comme un être humain actuel et complet, digne de considération, et non comme un simple être en devenir."}, {"term": "Droit de l'enfant", "definition": "affirmation des droits fondamentaux de l'enfant, notamment le droit d'être respecté, d'être entendu et de vivre dans un cadre digne."}, {"term": "Autonomie et citoyenneté enfantine", "definition": "participation active des enfants à la vie collective et à l'élaboration des règles communes (notamment par des institutions comme le tribunal ou le parlement des enfants)."}], "refs": ["Korczak, J. (1919/1998). Comment aimer un enfant. Robert Laffont.", "Korczak, J. (1929/2009). Le droit de l'enfant au respect. Fabert."]}, "jean-epstein": {"name": "Jean Epstein", "profession": "Cinéaste et théoricien du cinéma", "sortName": "Epstein", "terms": [{"term": "Photogénie", "definition": "qualité propre à l'image cinématographique qui révèle et amplifie la valeur expressive et émotionnelle d'un être ou d'un objet par le mouvement et le cadrage."}, {"term": "Cinéphilie / mouvement cinématographique", "definition": "passion et réflexion sur le cinéma comme art du mouvement, du rythme et de la perception renouvelée du réel."}, {"term": "Conscience machine / intelligence du cinéma", "definition": "capacité du dispositif cinématographique à produire une perception non humaine, mobile et révélatrice du monde."}], "refs": ["Korczak, J. (1919/1998). Comment aimer un enfant. Robert Laffont.", "Korczak, J. (1929/2009). Le droit de l'enfant au respect. Fabert."], "note": "Références identiques à celles de Janusz Korczak dans le fichier d'origine : à vérifier."}, "jean-piaget": {"name": "Jean Piaget", "profession": "Psychologue du développement et épistémologue", "sortName": "Piaget", "terms": [{"term": "Assimilation", "definition": "intégration de nouvelles informations ou expériences dans des structures ou schèmes déjà existants."}, {"term": "Accommodation", "definition": "modification des schèmes existants pour s'adapter à une situation ou un objet nouveau qui résiste à l'assimilation."}, {"term": "Équilibration", "definition": "processus d'autorégulation par lequel l'individu cherche un équilibre dynamique entre assimilation et accommodation."}, {"term": "Schèmes", "definition": "structures organisées d'actions ou de pensées (sensorimotrices puis opératoires) transférables et généralisables à des situations analogues."}, {"term": "Stades du développement cognitif", "definition": "étapes successives de construction de l'intelligence (sensorimoteur, préopératoire, opératoire concret, formel)."}, {"term": "Permanence de l'objet", "definition": "compréhension que l'objet continue d'exister même lorsqu'il échappe temporairement à la perception directe."}], "refs": ["Piaget, J. (1936). La naissance de l'intelligence chez l'enfant. Delachaux et Niestlé.", "Piaget, J., & Inhelder, B. (1966). La psychologie de l'enfant. PUF."]}, "jean-pierre-yernaux": {"name": "Jean-Pierre Yernaux", "profession": "Psychomotricien et formateur d'adultes", "sortName": "Yernaux", "terms": [{"term": "Psychomotricité et lien social", "definition": "rôle de l'approche psychomotrice dans le maintien, la restauration et l'enrichissement des liens relationnels et sociaux."}, {"term": "Identité professionnelle du psychomotricien", "definition": "repères déontologiques, cliniques et corporels définissant la spécificité du métier de psychomotricien."}, {"term": "Approche relationnelle et corporelle", "definition": "pratique fondée sur la rencontre, l'engagement corporel et l'ajustement mutuel."}], "refs": ["Yernaux, J.-P. — Articles et interventions sur l'identité professionnelle et la clinique psychomotrice (revues francophones de psychomotricité / Belgique)."]}, "john-bowlby": {"name": "John Bowlby", "profession": "Psychiatre et psychanalyste", "sortName": "Bowlby", "terms": [{"term": "Théorie de l'attachement", "definition": "théorie selon laquelle le nourrisson possède une disposition biologique innée à rechercher la proximité d'un adulte protecteur pour assurer sa survie et sa sécurité."}, {"term": "Figures d'attachement", "definition": "personnes privilégiées vers lesquelles l'enfant se tourne en situation de détresse, de fatigue ou d'insécurité."}, {"term": "Base de sécurité (secure base)", "definition": "figure d'attachement fiable à partir de laquelle l'enfant peut explorer le monde et vers laquelle il peut revenir pour être rassuré."}, {"term": "Modèle interne opérant (MIO)", "definition": "représentation mentale inconsciente de soi, des autres et des relations construite à partir des expériences d'attachement."}, {"term": "Protestation / détresse / détachement", "definition": "phases réactionnelles observées chez le jeune enfant face à une séparation prolongée ou une rupture du lien d'attachement."}], "refs": ["Bowlby, J. (1969/1978). Attachement et perte (Vol. 1 : L'attachement). PUF.", "Bowlby, J. (1973/1978). Attachement et perte (Vol. 2 : La séparation). PUF.", "Bowlby, J. (1988). A Secure Base. Routledge."]}, "julian-de-ajuriaguerra": {"name": "Julian de Ajuriaguerra", "profession": "Neurologue et psychiatre", "sortName": "Ajuriaguerra", "terms": [{"term": "Dialogue tonique (approfondissement clinique)", "definition": "élaboration clinique de l'échange tonico-postural et affectif entre le sujet et l'autre, au cœur de la relation et de la relaxation."}, {"term": "Syndromes psychomoteurs", "definition": "ensembles organisés de troubles toniques, moteurs et relationnels (ex. : instabilité, inhibition, maladresse, tics)."}, {"term": "Organisation psychomotrice", "definition": "agencement dynamique du tonus, de la posture, du geste, de l'espace et du temps en lien avec la vie psychique."}, {"term": "Relaxation thérapeutique", "definition": "méthode de travail corporel et tonique visant la réorganisation de l'expérience corporelle et l'apaisement des tensions."}], "refs": ["Ajuriaguerra, J. de (1970). Manuel de psychiatrie de l'enfant. Masson.", "Ajuriaguerra, J. de, & Cahen, M. (1960). « Tonus corporel et relation avec autrui ». Revue de Médecine Psychosomatique."]}, "marc-thiry": {"name": "Marc Thiry", "profession": "Kinésithérapeute, psychomotricien, haptonome et enseignant", "sortName": "Thiry", "terms": [{"term": "Approche Snoezelen (sensorialité, sécurisation, « être » plutôt que « faire »)", "definition": "démarche d'accompagnement multisensoriel visant l'apaisement, le bien-être et la relation dans une atmosphère sécurisante et non performative."}, {"term": "Haptonomie / contact affectif", "definition": "approche centrée sur le toucher affectif, sécurisant et confirmant qui soutient l'autre dans son être."}, {"term": "Communication sensorielle", "definition": "échange fondé sur les perceptions sensorielles et la qualité du contact lorsque le langage verbal est limité ou difficile."}], "refs": ["Thiry, M. — Travaux, formations et supports pédagogiques sur l'approche Snoezelen et l'accompagnement psychomoteur (Belgique / HEPN)."]}, "marion-milner": {"name": "Marion Milner", "profession": "Psychanalyste et peintre", "sortName": "Milner", "terms": [{"term": "Espaces / zones d'illusion", "definition": "lieux psychiques intermédiaires où l'imagination, la rêverie et la création peuvent se déployer librement."}, {"term": "Créativité et activité picturale", "definition": "rôle du dessin et de la création artistique dans l'exploration de soi et l'émergence de formes nouvelles."}, {"term": "Pliable medium (médium malléable)", "definition": "matériau souple et réceptif qui se laisse modeler et transformer sans opposer une résistance rigide ou destructrice."}, {"term": "Concentration / attention non dirigée", "definition": "mode d'attention ouverte, réceptive et non forcée permettant l'émergence d'idées ou d'éprouvés implicites."}], "refs": ["Milner, M. (1950). On Not Being Able to Paint. Heinemann.", "Milner, M. (1952). « Aspects of symbolism in comprehension of the not-self ». International Journal of Psycho-Analysis."]}, "mihaly-csikszentmihalyi": {"name": "Mihály Csíkszentmihályi", "profession": "Psychologue", "sortName": "Csíkszentmihályi", "terms": [{"term": "Flow (état d'absorption / expérience optimale)", "definition": "état de concentration intense, d'engagement total et de plaisir éprouvé dans une activité qui capte pleinement l'attention."}, {"term": "Équilibre défi-compétence", "definition": "ajustement entre le niveau de difficulté de la tâche et les capacités de la personne, favorisant l'émergence du flow (ni ennui, ni anxiété)."}, {"term": "Motivation intrinsèque", "definition": "engagement dans une activité pour la satisfaction, l'intérêt ou l'expérience qu'elle procure en elle-même."}], "refs": ["Csíkszentmihályi, M. (1990). Flow: The Psychology of Optimal Experience. Harper & Row (trad. fr. Vivre : la psychologie du bonheur, Robert Laffont, 2004)."]}, "paul-ricoeur": {"name": "Paul Ricoeur", "profession": "Philosophe", "sortName": "Ricoeur", "terms": [{"term": "Identité narrative", "definition": "identité d'une personne qui se construit et se comprend à travers les récits qu'elle fait de sa vie et de ses actions."}, {"term": "Herméneutique", "definition": "art et théorie de l'interprétation visant à comprendre le sens des textes, des symboles et des actions humaines."}, {"term": "Soi-même comme un autre", "definition": "conception de l'identité articulant la permanence de soi dans le temps et l'altérité relationnelle et éthique."}, {"term": "Interprétation et reconnaissance", "definition": "démarche de compréhension médiatisée par les signes et les récits, associée à la quête de reconnaissance mutuelle."}], "refs": ["Ricoeur, P. (1983–1985). Temps et récit (Tomes 1 à 3). Seuil.", "Ricoeur, P. (1990). Soi-même comme un autre. Seuil.", "Ricoeur, P. (2004). Parcours de la reconnaissance. Stock."]}, "pierre-delion": {"name": "Pierre Delion", "profession": "Pédopsychiatre et psychanalyste", "sortName": "Delion", "terms": [{"term": "Psychothérapie institutionnelle", "definition": "approche soignante qui travaille l'institution elle-même (vie quotidienne, espaces, réunions, collectifs) comme outil thérapeutique."}, {"term": "Fonction phorique (porter, soutenir, transporter)", "definition": "fonction de portage physique, psychique et symbolique exercée par l'équipe et l'environnement auprès de personnes en difficulté."}, {"term": "Holding institutionnel", "definition": "capacité de l'équipe et du cadre institutionnel à contenir, soutenir et maintenir une continuité de soins face aux angoisses."}, {"term": "Accueil de la psychose / de l'autisme", "definition": "démarche clinique et institutionnelle attentive au rythme, aux particularités sensorielles et à l'altérité des personnes concernées."}], "refs": ["Delion, P. (2000). L'enfant autiste, le bébé et la sémiotique. PUF.", "Delion, P. (2018). Fonction phorique, holding et institution. Érès."]}, "rene-descartes": {"name": "René Descartes", "profession": "Philosophe et mathématicien", "sortName": "Descartes", "terms": [{"term": "Dualisme corps-esprit (res cogitans / res extensa)", "definition": "distinction philosophique entre la substance pensante immatérielle (res cogitans) et la substance corporelle étendue dans l'espace (res extensa)."}, {"term": "Glande pinéale", "definition": "structure cérébrale que Descartes considérait comme le point de rencontre particulier entre l'âme et le corps."}, {"term": "Mécanisme corporel", "definition": "conception du corps humain (et animal) fonctionnant selon des lois physiques et mécaniques semblables à celles d'une machine."}, {"term": "Doute méthodique", "definition": "démarche consistant à suspendre provisoirement tout ce qui peut être mis en doute afin de rechercher une vérité certaine et indubitable."}], "refs": ["Descartes, R. (1637). Discours de la méthode.", "Descartes, R. (1641). Méditations métaphysiques.", "Descartes, R. (1649). Les Passions de l'âme."]}, "rene-roussillon": {"name": "René Roussillon", "profession": "Psychanalyste et professeur de psychologie clinique", "sortName": "Roussillon", "terms": [{"term": "Médium malléable", "definition": "objet ou matériau (et fonction de l'environnement/du thérapeute) qui est indéfiniment transformable, sensible, indestructible, disponible et inconditionnel pour soutenir la symbolisation."}, {"term": "Symbolisation primaire et secondaire", "definition": "la symbolisation primaire transforme les éprouvés bruts/archaïques en représentations-choses ou traces figurables ; la symbolisation secondaire les articule dans des chaînes représentatives et verbales."}, {"term": "Clivage et retour du clivé", "definition": "mécanisme par lequel des parties de la vie psychique ou d'une expérience sont séparées et tenues à distance, tout en tendant à réapparaître sous d'autres formes."}, {"term": "Associativité et jeu", "definition": "libre circulation des représentations et des mises en jeu permettant d'explorer et d'élaborer les mouvements psychiques."}, {"term": "Objet trouvé-créé", "definition": "expérience où l'objet rencontré dans la réalité externe correspond suffisamment à l'attente interne pour être à la fois découvert et subjectivement créé."}], "refs": ["Roussillon, R. (1991). Paradoxes et situations limites de la psychanalyse. PUF.", "Roussillon, R. (1999). Agonie, clivage et symbolisation. PUF.", "Roussillon, R. (2008). Le jeu et l'entre-je(u). PUF."]}, "rene-spitz": {"name": "René Spitz", "profession": "Psychanalyste et psychiatre", "sortName": "Spitz", "terms": [{"term": "Hospitalisme", "definition": "ensemble de troubles graves (développementaux, affectifs, somatiques et relationnels) observés chez des nourrissons placés en institution avec carence affective et relationnelle."}, {"term": "Dépression anaclitique", "definition": "tableau dépressif survenant chez un bébé après la perte brusque d'une relation affective satisfaisante et d'un objet d'attachement privilégié."}, {"term": "Organisateurs de la psyché (sourire social, angoisse du 8e mois, le « non »)", "definition": "jalons développementaux marqués par des réactions spécifiques qui signalent une réorganisation profonde de la vie psychique et relationnelle."}, {"term": "Relation d'objet", "definition": "modalité d'investissement affectif et relationnel d'un sujet envers l'autre (l'« objet » au sens psychanalytique)."}], "refs": ["Spitz, R. A. (1945). « Hospitalism ». The Psychoanalytic Study of the Child.", "Spitz, R. A. (1965/1968). De la naissance à la parole : la première année de la vie. PUF."]}, "rudolf-laban": {"name": "Rudolf Laban", "profession": "Chorégraphe, danseur et théoricien du mouvement", "sortName": "Laban", "terms": [{"term": "Laban Movement Analysis (LMA)", "definition": "système d'observation, de description et d'analyse du mouvement humain (corps, effort, espace, forme)."}, {"term": "Facteurs du mouvement (flux, espace, poids, temps)", "definition": "dimensions qualitatives de l'effort dansant/mouvement"}, {"term": "Flux (flow)", "definition": "continuité et contrôle du mouvement (libre/fluide vs retenu/contrôlé)."}, {"term": "Espace", "definition": "orientation et trajectoire du mouvement (direct/linéaire vs indirect/souple/multidirectionnel)."}, {"term": "Poids", "definition": "rapport à la gravité et dosage de la force/intention (ferme/fort vs léger/délicat)."}, {"term": "Temps", "definition": "rapidité et urgence ou étirement du mouvement (soudain/rapide vs soutenu/progressif)."}, {"term": "Kinésphère", "definition": "sphère d'espace personnelle entourant le corps et accessible par l'extension des membres sans déplacement du lieu d'ancrage."}], "refs": ["Laban, R. (1950). The Mastery of Movement on the Stage (trad. fr. La maîtrise du mouvement, Actes Sud, 1994).", "Laban, R., & Lawrence, F. C. (1947). Effort. Macdonald & Evans."]}, "sandrine-perriere": {"name": "Sandrine Perrière", "profession": "Psychothérapeute / praticienne en relation d'aide et accompagnement corporel (à préciser selon le contexte précis de ton cours)", "sortName": "Perrière", "terms": [{"term": "Approche relationnelle et corporelle / accompagnement psychocorporel", "definition": "démarche d'accompagnement attentive à la relation, au ressenti corporel et aux processus émotionnels de la personne."}], "refs": ["Supports et enseignements cliniques en accompagnement relationnel et psychocorporel (à compléter selon le support de ton cours)."], "note": "Profession et références à préciser."}, "sigmund-freud": {"name": "Sigmund Freud", "profession": "Neurologue et fondateur de la psychanalyse", "sortName": "Freud", "terms": [{"term": "Inconscient", "definition": "instance et lieu psychique regroupant des contenus refoulés ou non conscients (représentations, affects, désirs) qui agissent sur la vie psychique et les comportements."}, {"term": "Ça / moi / surmoi", "definition": "trois instances de la seconde topique : le ça (pôle pulsionnel et inconscient), le moi (instance de médiation avec la réalité, le ça et le surmoi) et le surmoi (intériorisation des interdits, exigences morales et idéaux)."}, {"term": "Pulsions (Éros / Thanatos, pulsion de vie / de mort)", "definition": "poussées dynamiques à la frontière du somatique et du psychique, orientées vers la liaison et la préservation de la vie (Éros) ou vers la déliaison, la réduction des tensions et la destruction (Thanatos)."}, {"term": "Refoulement", "definition": "mécanisme de défense par lequel des représentations ou souvenirs liés à une pulsion sont maintenus dans l'inconscient lorsque leur accès à la conscience engendrerait du déplaisir ou de l'angoisse."}, {"term": "Transfert", "definition": "déplacement sur la personne du thérapeute de sentiments, désirs, attentes et conflits inconscients issus de relations antérieures."}, {"term": "Mécanismes de défense", "definition": "opérations psychiques (souvent inconscientes) mises en jeu par le moi pour réduire l'angoisse et protéger l'équilibre psychique."}, {"term": "Stade du miroir / œdipe", "definition": ""}, {"term": "Œdipe", "definition": "complexe organisateur du psychisme marqué par l'attirance ambivalente envers le parent de sexe opposé et la rivalité/identification avec le parent de même sexe."}], "refs": ["Freud, S. (1900). L'Interprétation du rêve.", "Freud, S. (1915). Métapsychologie (« Pulsions et destins des pulsions », « Le refoulement »).", "Freud, S. (1923). Le Moi et le Ça."], "note": "Définition du « stade du miroir » à compléter."}, "sophie-marinopoulos": {"name": "Sophie Marinopoulos", "profession": "Psychologue clinicienne et psychanalyste", "sortName": "Marinopoulos", "terms": [{"term": "Santé culturelle", "definition": "dimension culturelle et symbolique du bien-être et de la santé psychique, incluant l'accès aux arts, aux contes, aux berceuses et aux rites partagés."}, {"term": "Parentalité / naissance d'un parent", "definition": "processus de transformation psychique, identitaire et relationnel vécu par les adultes à l'arrivée d'un enfant."}, {"term": "Jeu libre et créativité de l'enfant", "definition": "espace spontané d'exploration et de création permettant à l'enfant d'éprouver sa liberté et de symboliser."}, {"term": "Berceuse / espace transitionnel et accueil familial", "definition": "supports d'apaisement, de lien et d'accueil favorisant la sécurité et la rencontre entre l'enfant et ses proches."}], "refs": ["Marinopoulos, S. (2005). Dans l'intime des mères. Fayard.", "Marinopoulos, S. (2019). Une stratégie nationale pour la Santé Culturelle (Rapport ministériel)."]}, "stephen-porges": {"name": "Stephen Porges", "profession": "Neuroscientifique et psychologue", "sortName": "Porges", "terms": [{"term": "Théorie polyvagale (TPV)", "definition": "modèle neurophysiologique décrivant comment le système nerveux autonome hiérarchise les réponses de sécurité, de mobilisation et d'immobilisation selon le contexte."}, {"term": "Système vague ventral (engagement social)", "definition": "voie parasympathique favorisant le calme, la régulation, la communication faciale/vocale et la relation sociale sécurisée."}, {"term": "Système sympathique (combat/fuite)", "definition": "voie de mobilisation énergétique préparant l'organisme à l'action, à la défense ou à la fuite face à une menace."}, {"term": "Vague dorsal (figement/immobilisation)", "definition": "voie parasympathique plus archaïque associée au ralentissement, à l'économie d'énergie, au repli ou à la sidération/dissociation face à un danger extrême."}, {"term": "Neuroception", "definition": "détection inconsciente et automatique par le système nerveux des indices de sécurité, de danger ou de menace de mort dans l'environnement et les relations."}], "refs": ["Porges, S. W. (2011). The Polyvagal Theory. W. W. Norton (trad. fr. La théorie polyvagale, EDP Sciences, 2021)."]}, "suzanne-robert-ouvray": {"name": "Suzanne Robert-Ouvray", "profession": "Psychomotricienne, psychologue clinicienne et auteure", "sortName": "Robert-Ouvray", "terms": [{"term": "Intégration motrice primordiale (IMP)", "definition": "processus de maturation et d'intégration des réflexes, schèmes et coordinations motrices précoces qui soutient le développement psychique et cognitif."}, {"term": "Dialogues tonico-émotionnels précoces", "definition": "échanges corporels et toniques très précoces entre le bébé et l'adulte véhiculant sécurité, émotions et repères."}, {"term": "Hypertonie / hypotonie", "definition": "variations du tonus musculaire caractérisées respectivement par un excès de tension/résistance musculaire (hypertonie) ou par un tonus diminué/relâché (hypotonie)."}, {"term": "Étapes du développement psychomoteur", "definition": "séquences d'évolution posturale, motrice et sensorielle jalonnant la construction du bébé et de l'enfant."}], "refs": ["Robert-Ouvray, S. (1993). Intégration motrice et développement psychique. Desclée de Brouwer.", "Robert-Ouvray, S. (1996). L'enfant tonique et sa mère. Desclée de Brouwer."]}, "sylvie-donnet": {"name": "Sylvie Donnet", "profession": "Rééducatrice / psychomotricienne et psychologue", "sortName": "Donnet", "terms": [{"term": "Éducation psychomotrice", "definition": "approche éducative utilisant le mouvement, le jeu et l'espace pour accompagner le développement global de l'enfant."}, {"term": "Découpage ternaire de l'espace (plaisir sensori-moteur, plaisir symbolique, pensée opératoire / création)", "definition": "organisation de l'espace d'activité en trois registres progressifs permettant le passage du jeu sensori-moteur au symbolisme puis à l'activité plus structurée/créative."}, {"term": "Décentration", "definition": "capacité à dépasser le point de vue ou l'impulsion immédiate pour adopter d'autres perspectives ou modalités d'action."}], "refs": ["Donnet, S. — Travaux cliniques et pédagogiques en éducation psychomotrice (en lien avec les dispositifs d'espace ternaire de la PPA)."]}, "virginie-axaline": {"name": "Virginie Axaline", "profession": "Psychologue", "sortName": "Axaline", "terms": [{"term": "Thérapie par le jeu centrée sur l'enfant (Non-directive Play Therapy)", "definition": "approche thérapeutique où l'enfant dirige librement son jeu dans un cadre sécurisant tandis que le thérapeute l'accompagne sans diriger ni forcer."}, {"term": "Huit principes de la relation thérapeutique par le jeu", "definition": "règles d'attitude du thérapeute (chaleur, acceptation, permissivité, reconnaissance des sentiments, respect de l'autonomie de l'enfant, non-directivité, progressivité, limites réalistes)."}, {"term": "Acceptation inconditionnelle", "definition": "accueil de l'enfant et de ses émotions sans jugement ni critique, tout en posant des limites claires et nécessaires à la sécurité."}], "refs": ["Axline, V. M. (1947). Play Therapy. Houghton Mifflin.", "Axline, V. M. (1964). Dibs in Search of Self (trad. fr. Dibs à la recherche de soi, Flammarion)."]}, "wilhelm-griesinger": {"name": "Wilhelm Griesinger", "profession": "Psychiatre et neurologue", "sortName": "Griesinger", "terms": [{"term": "Corrélat cérébral des maladies mentales (« les maladies mentales sont des maladies du cerveau »)", "definition": "thèse psychiatrique affirmant que les troubles mentaux s'enracinent dans des processus neurobiologiques et cérébraux."}, {"term": "Unité des psychoses", "definition": "conception selon laquelle les différentes formes de psychoses représentent des degrés ou manifestations variées d'un même processus pathologique fondamental."}], "refs": ["Griesinger, W. (1845). Die Pathologie und Therapie der psychischen Krankheiten (trad. fr. Traité des maladies mentales, 1865)."]}};

function norm(s){return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function save(a){return col.doc(a.id).set({name:a.name,profession:a.profession||"",sortName:a.sortName||a.name.split(" ").pop(),terms:a.terms||[],refs:a.refs||[],note:a.note||""})}
function safe(p){p.catch(function(){$("err")?($("err").textContent="Modification impossible : vous n’avez peut-être pas les droits d’édition."):alert("Modification impossible : vous n’avez peut-être pas les droits d’édition.")});return p}
function find(id){return authors.filter(function(a){return a.id===id})[0]}

function render(){
  var q=norm($("q").value),out=$("out");out.textContent="";
  if(!loaded){out.appendChild(el("p","msg","Chargement…"));return}
  if(tab==="t"){
    var all=[];authors.forEach(function(a){a.terms.forEach(function(t,i){all.push({t:t,a:a,i:i})})});
    all=all.filter(function(x){return !q||norm(x.t.term+" "+x.t.definition+" "+x.a.name).indexOf(q)>-1}).sort(function(x,y){return cmp(x.t.term,y.t.term)});
    if(!all.length){out.appendChild(el("p","empty","Aucun terme."));return}
    var L="";
    all.forEach(function(x){
      var l=norm(x.t.term).charAt(0).toUpperCase();
      if(l!==L){L=l;out.appendChild(el("div","letter",l))}
      var c=el("div","card");c.appendChild(el("h3","",x.t.term));
      c.appendChild(el("p","def",x.t.definition||"Définition à compléter."));
      var p=el("p","prof","");var b=el("button","who",x.a.name);b.onclick=function(){go("a",x.a.id)};p.appendChild(b);
      var ed=el("button","x"," · modifier");ed.onclick=function(){formTerm(x.a.id,x.i)};p.appendChild(ed);
      c.appendChild(p);out.appendChild(c)});
  }else{
    var list=authors.filter(function(a){return !q||norm(a.name+" "+a.profession+" "+a.terms.map(function(t){return t.term}).join(" ")+" "+a.refs.join(" ")).indexOf(q)>-1}).sort(function(x,y){return cmp(x.sortName,y.sortName)});
    if(!list.length){out.appendChild(el("p","empty","Aucun auteur."));return}
    list.forEach(function(a){
      var c=el("div","card");c.id="a-"+a.id;
      var h=el("h3","",a.name);h.style.cursor="pointer";h.onclick=function(){open[a.id]=!open[a.id];render()};c.appendChild(h);
      c.appendChild(el("p","prof",a.profession+" · "+a.terms.length+" terme(s) · "+a.refs.length+" réf."));
      if(open[a.id]||q){
        if(a.note)c.appendChild(el("div","note","À vérifier : "+a.note));
        c.appendChild(el("div","lb","Termes"));
        a.terms.forEach(function(t,i){var d=el("div","t");d.appendChild(el("strong","",t.term));d.appendChild(el("p","def",t.definition||"Définition à compléter."));c.appendChild(d)});
        c.appendChild(el("div","lb","Références théoriques"));
        if(!a.refs.length)c.appendChild(el("p","def","Aucune référence."));
        var u=el("ul");a.refs.forEach(function(r,i){var li=el("li","",r+" ");var x=el("button","x","✕");x.onclick=function(){if(x.textContent==="✕"){x.textContent="Confirmer ?";return}a.refs.splice(i,1);safe(save(a))};li.appendChild(x);u.appendChild(li)});c.appendChild(u);
        var r=el("div","row");
        [["+ Terme",function(){formTerm(a.id,-1)}],["+ Référence",function(){formRef(a.id)}],["Modifier l’auteur",function(){formAuthor(a.id)}]].forEach(function(z){var b=el("button","btn s",z[0]);b.onclick=z[1];r.appendChild(b)});
        c.appendChild(r);
      }
      out.appendChild(c)});
  }
}
function go(t,id){tab=t;$("q").value="";if(id)open[id]=true;sync();render();if(id)setTimeout(function(){var e=$("a-"+id);e&&e.scrollIntoView({behavior:"smooth"})},50)}
function sync(){$("n-t").className=tab==="t"?"on":"";$("n-a").className=tab==="a"?"on":"";$("add").textContent=tab==="t"?"+ Terme":"+ Auteur"}

function modal(title,fields,onOk,onDel){
  var f=$("fm");f.textContent="";f.appendChild(el("h3","",title));
  fields.forEach(function(d){f.appendChild(el("label","",d.l));var i=d.sel?el("select"):(d.area?el("textarea"):el("input"));i.id=d.id;
    if(d.sel){d.sel.forEach(function(o){var op=el("option","",o[1]);op.value=o[0];i.appendChild(op)})}
    i.value=d.v||"";f.appendChild(i)});
  f.appendChild(el("div","")).id="err";
  var r=el("div","row");var ok=el("button","btn","Enregistrer");ok.type="submit";var no=el("button","btn s","Annuler");no.type="button";no.onclick=close;r.appendChild(ok);r.appendChild(no);
  if(onDel){var d=el("button","btn d","Supprimer");d.type="button";d.onclick=function(){if(d.textContent!=="Supprimer"){safe(onDel().then(close));return}d.textContent="Confirmer ?"};r.appendChild(d)}
  f.appendChild(r);
  f.onsubmit=function(e){e.preventDefault();var p=onOk();if(p)safe(p.then(close))};
  $("md").className="on";var first=f.querySelector("input,textarea,select");first&&first.focus()}
function close(){$("md").className=""}
function v(i){return $(i).value.trim()}
function authOpts(){return authors.slice().sort(function(a,b){return cmp(a.sortName,b.sortName)}).map(function(a){return [a.id,a.name]})}
function formAuthor(id){
  var a=id?find(id):null;
  modal(a?"Modifier l’auteur":"Nouvel auteur",[{l:"Nom",id:"f-n",v:a&&a.name},{l:"Profession / domaine",id:"f-p",v:a&&a.profession},{l:"Terme (facultatif)",id:"f-t"},{l:"Définition du terme (facultatif)",id:"f-d",area:1},{l:"Référence (facultatif)",id:"f-r",area:1}].filter(function(x){return a?x.id==="f-n"||x.id==="f-p":true}),function(){
    if(!v("f-n")){$("err").textContent="Le nom est requis.";return}
    var o=a||{id:slug(v("f-n")),terms:[],refs:[]};
    if(!a&&find(o.id)){$("err").textContent="Cet auteur existe déjà.";return}
    o.name=v("f-n");o.profession=v("f-p");if(!a)o.sortName=o.name.split(" ").pop();
    if(!a){if(v("f-t"))o.terms.push({term:v("f-t"),definition:v("f-d")});if(v("f-r"))o.refs.push(v("f-r"))}
    return save(o)},a?function(){return col.doc(a.id).delete()}:null)}
function formTerm(aid,i){
  var a=aid?find(aid):null,t=a&&i>=0?a.terms[i]:null;
  modal(t?"Modifier le terme":"Nouveau terme",[{l:"Auteur",id:"f-a",sel:authOpts(),v:aid},{l:"Terme",id:"f-t",v:t&&t.term},{l:"Définition courte",id:"f-d",area:1,v:t&&t.definition}],function(){
    if(!v("f-t")){$("err").textContent="Le terme est requis.";return}
    var b=find($("f-a").value);if(!b){$("err").textContent="Choisissez un auteur (ajoutez-le d’abord dans l’onglet Auteurs).";return}
    var n={term:v("f-t"),definition:v("f-d")};
    if(t&&b===a)b.terms[i]=n;else{if(t)a.terms.splice(i,1),save(a);b.terms.push(n)}
    return save(b)},t?function(){a.terms.splice(i,1);return save(a)}:null)}
function formRef(aid){
  modal("Nouvelle référence",[{l:"Auteur",id:"f-a",sel:authOpts(),v:aid},{l:"Référence (format APA conseillé)",id:"f-r",area:1}],function(){
    var b=find($("f-a").value);if(!v("f-r")||!b){$("err").textContent="Référence requise.";return}
    b.refs.push(v("f-r"));return save(b)})}

$("n-t").onclick=function(){go("t")};$("n-a").onclick=function(){go("a")};
$("q").oninput=render;
$("add").onclick=function(){tab==="t"?formTerm(null,-1):formAuthor(null)};
$("md").onclick=function(e){if(e.target===$("md"))close()};
sync();
var KEY="psychomotricite-v1",store=null;
try{store=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!store)store=JSON.parse(JSON.stringify(SEED));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function refresh(){authors=Object.keys(store).map(function(id){var x=store[id];return{id:id,name:x.name||id,profession:x.profession||"",sortName:x.sortName||x.name||id,terms:x.terms||[],refs:x.refs||[],note:x.note||""}});if($("md").className!=="on")render()}
col={doc:function(id){return{set:function(o){store[id]=o;persist();refresh();return Promise.resolve()},delete:function(){delete store[id];persist();refresh();return Promise.resolve()}}}};
loaded=true;refresh();
$("exp").onclick=function(){var u=URL.createObjectURL(new Blob([JSON.stringify(store,null,1)],{type:"application/json"}));var l=document.createElement("a");l.href=u;l.download="psychomotricite-donnees.json";document.body.appendChild(l);l.click();l.remove()};
$("imp").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);Object.keys(o).forEach(function(k){store[k]=o[k]});persist();refresh()}catch(x){alert("Fichier invalide.")}};r.readAsText(f)};
$("rst").onclick=function(){if($("rst").textContent!=="Réinitialiser"){store=JSON.parse(JSON.stringify(SEED));persist();refresh();$("rst").textContent="Réinitialiser";return}$("rst").textContent="Confirmer ?"};
})();
</script>
</body>
